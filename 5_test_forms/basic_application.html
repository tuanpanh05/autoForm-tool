<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Application Form</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="number"],
        input[type="tel"], input[type="date"], textarea, select {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;
        }
        textarea { height: 80px; resize: vertical; }
        fieldset { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        legend { font-weight: bold; padding: 0 10px; }
        .radio-group label, .checkbox-group label { display: inline; font-weight: normal; margin-right: 15px; }
        .required::after { content: " *"; color: red; }
        button { background: #4CAF50; color: white; padding: 10px 30px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #45a049; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>Test Application Form</h1>
    <p>Please fill in your information below.</p>

    <form id="application-form" action="#" method="post">

        <!-- Section 1: Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <div class="form-group">
                <label for="full-name" class="required">Full Name</label>
                <input type="text" id="full-name" name="full_name" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email" class="required">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="0123456789">
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="date_of_birth">
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male"> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                    <label><input type="radio" name="gender" value="other"> Other</label>
                </div>
            </div>
        </fieldset>

        <!-- Section 2: Education -->
        <fieldset>
            <legend>Education</legend>

            <div class="form-group">
                <label for="university" class="required">University</label>
                <input type="text" id="university" name="university" required placeholder="Your university">
            </div>

            <div class="form-group">
                <label for="major">Major / Field of Study</label>
                <input type="text" id="major" name="major" placeholder="e.g. Computer Science">
            </div>

            <div class="form-group">
                <label for="gpa">GPA</label>
                <input type="number" id="gpa" name="gpa" min="0" max="4" step="0.01" placeholder="3.50">
            </div>

            <div class="form-group">
                <label for="grad-year">Graduation Year</label>
                <select id="grad-year" name="graduation_year">
                    <option value="">-- Select --</option>
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                </select>
            </div>
        </fieldset>

        <!-- Section 3: Work & Skills -->
        <fieldset>
            <legend>Work & Skills</legend>

            <div class="form-group">
                <label for="company">Company / Organization</label>
                <input type="text" id="company" name="company" placeholder="Current or most recent">
            </div>

            <div class="form-group">
                <label for="position">Position / Job Title</label>
                <input type="text" id="position" name="position" placeholder="e.g. Junior Developer">
            </div>

            <div class="form-group">
                <label for="experience">Years of Experience</label>
                <input type="number" id="experience" name="years_of_experience" min="0" max="50">
            </div>

            <div class="form-group">
                <label>Programming Languages</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="languages" value="python"> Python</label>
                    <label><input type="checkbox" name="languages" value="java"> Java</label>
                    <label><input type="checkbox" name="languages" value="javascript"> JavaScript</label>
                    <label><input type="checkbox" name="languages" value="csharp"> C#</label>
                    <label><input type="checkbox" name="languages" value="cpp"> C++</label>
                </div>
            </div>
        </fieldset>

        <!-- Section 4: Additional -->
        <fieldset>
            <legend>Additional Information</legend>

            <div class="form-group">
                <label for="github">GitHub Profile</label>
                <input type="url" id="github" name="github" placeholder="https://github.com/username">
            </div>

            <div class="form-group">
                <label for="linkedin">LinkedIn Profile</label>
                <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/username">
            </div>

            <div class="form-group">
                <label for="about">Tell us about yourself</label>
                <textarea id="about" name="about" placeholder="Write a brief introduction..."></textarea>
            </div>
        </fieldset>

        <div class="form-group">
            <button type="submit">Submit Application</button>
        </div>
    </form>
</body>
</html>
